<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 · Японский N5 по «Минна но Нихонго»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ===================== ТОКЕНЫ =====================
   Одна тёмная тема «сумерки над Токио» — цвета взяты с фотографии в шапке:
   индиго неба, сакура, фонари, ворота-тории. */
html{
  color-scheme:dark;
  --font-ui:'Onest',system-ui,-apple-system,sans-serif;
  --font-jp:'Klee One','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
  --font-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --bg:#0f0e1c; --surface:#171528; --surface-2:#1f1c34; --surface-3:#28243f;
  --border:#2e2948; --border-strong:#443d66;
  --text:#f1ecf5; --muted:#a8a2c0;
  --sakura:#f4a6c1; --sakura-soft:color-mix(in srgb,#f4a6c1 14%,transparent);
  --lantern:#f5b95a; --torii:#ef6f52; --sky:#93a0ff; --lilac:#c7a6ff;
  --good:#6fd6a0; --bad:#ff7d88;
  --on-accent:#2b0f1d;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:16px;line-height:1.6;
  min-height:100vh;padding:20px clamp(12px,2.5vw,40px) 70px}
.wrap{position:relative;max-width:1500px;margin:0 auto}
.jp{font-family:var(--font-jp);font-weight:600}
ruby{ruby-position:over}
rt{font-family:var(--font-jp);font-weight:400;font-size:.52em;color:var(--sakura);letter-spacing:0;opacity:.95}
html.nofuri rt{visibility:hidden}
:focus-visible{outline:2px solid var(--lantern);outline-offset:2px;border-radius:6px}
button{font-family:inherit}

/* ===================== HERO ===================== */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border-strong);
  min-height:clamp(380px,56vh,600px);display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(170deg,#1b1a4a 0%,#4a2e63 40%,#c0584a 75%,#f0a04a 100%)}
/* Верхний слой — hero.jpg рядом с файлом; если его нет, виден градиент-закат. */
.hero-bg{position:absolute;inset:0;background:url('hero.jpg') center 58%/cover no-repeat}
.hero-bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(15,14,28,.55) 0%,rgba(15,14,28,.05) 32%,rgba(15,14,28,.25) 58%,rgba(15,14,28,.94) 100%),
             linear-gradient(90deg,rgba(15,14,28,.7) 0%,rgba(15,14,28,.15) 55%,transparent 100%)}
.hero-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;gap:12px;
  padding:22px 28px;font-size:13px;color:#e6dcef}
.hero-top b{color:#fff}
.hero-main{position:relative;z-index:2;padding:0 28px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero-title{font-family:var(--font-display);font-weight:800;color:#fff8f2;line-height:1;
  font-size:clamp(76px,15vw,196px);letter-spacing:.02em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.hero-title rt{font-size:.22em;color:var(--sakura);letter-spacing:.35em;font-family:var(--font-jp);font-weight:600;
  animation:furiIn 1.1s .5s cubic-bezier(.22,.61,.36,1) both}
@keyframes furiIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero-sub{font-size:clamp(16px,1.6vw,21px);color:#efe6f5;margin-top:10px;max-width:34ch;line-height:1.45}
.hero-card{background:rgba(15,14,28,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid color-mix(in srgb,var(--sakura) 35%,transparent);border-radius:14px;padding:14px 18px;
  font-size:14px;line-height:1.65;color:#ddd3e8;max-width:360px}
.hero-card b{color:#fff}

/* ===================== ПАНЕЛЬ ===================== */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:18px 0 12px;padding:10px 0;background:var(--bg)}
.bar.stuck{border-bottom:1px solid var(--border);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer}
.daylabel{font-size:14px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
  padding:5px 14px;border-radius:12px;min-width:180px;line-height:1.35}
.daylabel b{color:var(--text)}
.daylabel .sublabel{display:block;font-size:12px;color:var(--sakura)}
.pill{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;white-space:nowrap}
.pill b{color:var(--lantern)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

/* Все кнопки — в обводке цвета сакуры; заливка — у активной вкладки и главной кнопки. */
.tabs button,.subtabs button,.iconbtn,.btn,.opt,.match-btn,.chip,.furi-toggle{
  background:transparent;border:1.5px solid color-mix(in srgb,var(--sakura) 45%,transparent);color:var(--text);
  transition:background-color .18s,border-color .18s,color .18s}
.tabs button:hover:not(:disabled),.subtabs button:hover:not(:disabled),.iconbtn:hover:not(:disabled),
.btn:hover:not(:disabled),.opt:hover:not(:disabled),.match-btn:hover:not(:disabled),.chip:hover,.furi-toggle:hover{
  border-color:var(--sakura);background:var(--sakura-soft)}
.iconbtn:disabled{opacity:.3;cursor:default}
.tabs button{min-height:44px;padding:8px 16px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600}
.tabs button.active{background:var(--sakura);border-color:var(--sakura);color:var(--on-accent)}
.furi-toggle{min-height:44px;padding:6px 12px;border-radius:12px;cursor:pointer;font-family:var(--font-jp);font-weight:600;font-size:14px}
.furi-toggle[aria-pressed="true"]{border-color:var(--sakura);color:var(--sakura)}
.subtabs{display:none;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.subtabs button{min-height:40px;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.subtabs button.active{border-color:var(--sakura);color:var(--sakura);background:var(--sakura-soft)}
.badge{display:inline-block;background:var(--bad);color:#2a0710;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.badge:empty{display:none}
.progress{height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:20px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--sakura),var(--lantern));transition:width .4s}

/* ===================== ОБЩИЕ БЛОКИ ===================== */
.panel{display:none}
.sect-title{font-size:20px;font-weight:600;margin:28px 0 12px}
.sect-title small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.help{color:var(--muted);font-size:14px;line-height:1.6}
.help b{color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{min-height:38px;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted)}
.chip.active{background:var(--sakura-soft);border-color:var(--sakura);color:var(--text)}
.btn{min-height:46px;padding:10px 24px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600}
.btn.primary{background:var(--sakura);border-color:var(--sakura);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:#f8bcd1;border-color:#f8bcd1}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;white-space:nowrap;
  border:1px solid currentColor;line-height:1.6;font-family:var(--font-ui)}
.t-v1{color:var(--torii)} .t-v2{color:var(--sky)} .t-v3{color:var(--lantern)}
.t-i{color:var(--sakura)} .t-na{color:var(--lilac)} .t-other{color:var(--muted)}
.reg{font-size:12px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.reg-f{background:color-mix(in srgb,var(--sky) 18%,transparent);color:#c9d0ff}
.reg-c{background:color-mix(in srgb,var(--lantern) 18%,transparent);color:#ffd9a0}
.reg-n{background:var(--surface-3);color:var(--muted)}
.note{color:var(--lantern);font-size:13px;margin-top:4px}
mark{background:transparent;color:var(--lantern);border-bottom:2px solid color-mix(in srgb,var(--lantern) 55%,transparent)}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--sakura);color:var(--sakura);text-align:center}

/* ===================== ТАБЛИЦА СЛОВ ===================== */
.tablebox{overflow-x:auto;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td.num{color:var(--muted);width:40px;font-size:13px}
td.w{cursor:pointer;font-family:var(--font-jp);font-weight:600;font-size:22px;line-height:1.9;white-space:nowrap}
td.w:hover{color:var(--sakura)}
td.rd{font-family:var(--font-jp);font-size:15px;white-space:nowrap}
td.rd .pol{display:block;font-family:var(--font-ui);font-size:13px;color:var(--muted)}
td.tr .ex{font-family:var(--font-jp);font-size:16px;margin-top:6px;line-height:2}
td.tr .exru{color:var(--muted);font-size:14px}
td.chk{width:56px;text-align:center}
td.chk input{width:22px;height:22px;accent-color:var(--good);cursor:pointer;margin-top:8px}
tr.learned td.w{color:var(--good)}

.phr-list{display:grid;gap:8px}
.phr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:6px 18px;align-items:baseline;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.phr .jp{font-size:19px;line-height:2}
.phr .note{grid-column:1/-1;margin-top:0}

/* ===================== ГРАММАТИКА ===================== */
.gram{max-width:820px}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:12px}
.gcard h3{font-size:19px;font-weight:600;margin-bottom:6px;line-height:1.9}
.gcard h3 .jp{font-size:21px}
.gcard .ref{font-size:12px;color:var(--sky);margin-bottom:8px}
.gcard p{line-height:1.75;font-size:15.5px}
.gcard p b{color:var(--sakura);font-weight:600}
.gex{margin-top:12px;border-left:2px solid var(--border-strong);padding-left:14px}
.gex div{margin:4px 0}
.gex .jp{font-size:18px;line-height:2.1}
.gex .ru{color:var(--muted);font-size:14px}
.conj{overflow-x:auto;margin-top:12px}
.conj table{font-size:15px}
.conj td{font-family:var(--font-jp);font-size:17px;line-height:2;white-space:nowrap}
.conj td:first-child{font-family:var(--font-ui);font-size:13px}
.dlg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:12px}
.dlg>div{padding:8px 14px;border-bottom:1px solid var(--border)}
.dlg .h{background:var(--surface-2);font-size:13px;color:var(--muted)}
.dlg .jp{font-size:17px;line-height:2}
.dlg .ru{grid-column:1/-1;color:var(--muted);font-size:13px;padding-top:0;margin-top:-4px}

/* ===================== КАРТОЧКИ / УПРАЖНЕНИЯ ===================== */
.card{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;padding:30px 26px;text-align:center;max-width:720px;margin:0 auto}
.card .dir{color:var(--muted);font-size:14px}
.card .big{font-family:var(--font-jp);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:2;margin:8px 0 2px}
.card .sent{font-family:var(--font-jp);font-size:clamp(20px,3vw,26px);line-height:2.2;margin:12px 0 4px}
.card .hint{color:var(--muted);font-size:15px;margin-bottom:16px}
.card input[type=text]{width:100%;max-width:400px;min-height:48px;background:var(--surface-2);border:1.5px solid var(--border-strong);
  color:var(--text);padding:10px 16px;border-radius:12px;font-size:17px;text-align:center;font-family:var(--font-ui)}
.card input[type=text]:focus{outline:none;border-color:var(--sakura)}
.actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.counter{color:var(--muted);font-size:13px;margin-bottom:10px}
.feedback{margin-top:14px;font-size:16px;min-height:26px;font-weight:600}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.explain{margin-top:10px;font-size:15px;color:var(--text);background:var(--surface-2);border-radius:12px;padding:10px 14px;text-align:left;line-height:1.8}
.explain:empty{display:none}
.explain .jp{font-size:17px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{min-height:56px;padding:8px 12px;border-radius:14px;cursor:pointer;font-family:var(--font-jp);font-weight:600;font-size:20px;line-height:1.9}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,transparent);color:#dfffee}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent);color:#ffe3e6}
.opt:disabled{cursor:default}
.result .score{font-size:52px;font-weight:700;color:var(--sakura);margin:8px 0}

.fc-wrap{perspective:1200px;max-width:640px;margin:0 auto}
.fc-card{position:relative;height:320px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.fc-back{transform:rotateY(180deg);border-color:var(--sakura)}
.fc-word{font-family:var(--font-jp);font-weight:600;font-size:clamp(30px,6vw,48px);line-height:2}
.fc-ru{font-size:24px;font-weight:600;color:var(--sakura)}
.fc-ex{font-family:var(--font-jp);font-size:18px;line-height:2;margin-top:10px}
.fc-exru{color:var(--muted);font-size:14px}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 10px}
.fc-counter{color:var(--muted);font-size:14px;min-width:70px;text-align:center}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px;margin:0 auto 16px}
.match-btn{min-height:60px;padding:8px 12px;border-radius:14px;cursor:pointer;font-size:16px;line-height:1.5}
.match-btn.jpside{font-family:var(--font-jp);font-weight:600;font-size:20px;line-height:1.9}
.match-btn.sel{background:var(--sakura);border-color:var(--sakura);color:var(--on-accent)}
.match-btn.sel rt{color:var(--on-accent)}
.match-btn.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);cursor:default}
.match-btn.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent)}

/* ===================== ПРОГРЕСС ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat-card .k{color:var(--muted);font-size:14px}
.stat-card .v{font-size:36px;font-weight:700;color:var(--text);line-height:1.3}
.stat-card .s{color:var(--muted);font-size:13px}
.stat-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.stat-block h3{font-size:16px;font-weight:600;margin-bottom:12px}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto}
.hm{width:13px;height:13px;border-radius:3px;background:var(--surface-3)}
.hm1{background:color-mix(in srgb,var(--sakura) 35%,var(--surface-3))}
.hm2{background:color-mix(in srgb,var(--sakura) 65%,var(--surface-3))}
.hm3{background:var(--sakura)}

/* ===================== ПОПАП ===================== */
.word-popup{position:absolute;z-index:1000;background:var(--surface-3);border:1px solid var(--sakura);border-radius:14px;
  padding:14px 18px;width:300px;max-width:calc(100vw - 24px);box-shadow:0 14px 40px rgba(0,0,0,.5);
  opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .18s,transform .18s,visibility .18s}
.word-popup.show{opacity:1;visibility:visible;transform:none}
.word-popup .pw{font-family:var(--font-jp);font-weight:600;font-size:28px;line-height:1.9}
.word-popup .pk{font-family:var(--font-jp);font-size:15px;color:var(--muted)}
.word-popup .pr{font-size:16px;margin:6px 0}
.word-popup .pf{font-family:var(--font-jp);font-size:15px;line-height:2;border-top:1px solid var(--border-strong);margin-top:8px;padding-top:6px}
.word-popup .pf span{font-family:var(--font-ui);font-size:12px;color:var(--muted)}

/* ===================== ПОДСВЕТКА =====================
   Розовое свечение у кнопок и рамок при наведении и нажатии;
   у «Знаю / Не знаю» — зелёное. Наведение — только там, где есть мышь,
   чтобы на телефоне подсветка не «залипала» после касания. */
html{
  --glow-pink:0 0 0 1px color-mix(in srgb,var(--sakura) 55%,transparent),0 0 16px color-mix(in srgb,var(--sakura) 40%,transparent),0 0 34px color-mix(in srgb,var(--sakura) 16%,transparent);
  --glow-pink-strong:0 0 0 1px var(--sakura),0 0 22px color-mix(in srgb,var(--sakura) 60%,transparent),0 0 46px color-mix(in srgb,var(--sakura) 26%,transparent);
  --glow-green:0 0 0 1px color-mix(in srgb,var(--good) 60%,transparent),0 0 16px color-mix(in srgb,var(--good) 42%,transparent),0 0 34px color-mix(in srgb,var(--good) 16%,transparent);
  --glow-green-strong:0 0 0 1px var(--good),0 0 24px color-mix(in srgb,var(--good) 62%,transparent),0 0 48px color-mix(in srgb,var(--good) 26%,transparent);
  --glow-red:0 0 0 1px color-mix(in srgb,var(--bad) 60%,transparent),0 0 18px color-mix(in srgb,var(--bad) 40%,transparent);
}
.tabs button,.subtabs button,.iconbtn,.btn,.opt,.match-btn,.chip,.furi-toggle,
.tablebox,.gcard,.card,.phr,.stat-card,.stat-block,.fc-face,.daylabel,.pill,td.chk input{
  transition:background-color .2s,border-color .2s,color .2s,box-shadow .25s ease,transform .12s ease}
@media (hover:hover){
  .tabs button:hover:not(:disabled),.subtabs button:hover,.iconbtn:hover:not(:disabled),.btn:hover:not(:disabled),
  .opt:hover:not(:disabled),.match-btn:hover:not(:disabled),.chip:hover,.furi-toggle:hover{box-shadow:var(--glow-pink)}
  .tablebox:hover,.gcard:hover,.phr:hover,.stat-card:hover,.stat-block:hover,.card:hover,.daylabel:hover,.pill:hover{
    border-color:color-mix(in srgb,var(--sakura) 55%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--sakura) 16%,transparent)}
  .fc-card:hover .fc-face{box-shadow:0 0 30px color-mix(in srgb,var(--sakura) 26%,transparent)}
  td.chk input:hover{box-shadow:var(--glow-green)}
  .btn.know:hover:not(:disabled){border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);box-shadow:var(--glow-green)}
}
.tabs button:active:not(:disabled),.subtabs button:active,.iconbtn:active:not(:disabled),.btn:active:not(:disabled),
.opt:active:not(:disabled),.match-btn:active:not(:disabled),.chip:active,.furi-toggle:active{box-shadow:var(--glow-pink-strong);transform:scale(.97)}
.tabs button.active,.furi-toggle[aria-pressed="true"],.match-btn.sel{box-shadow:var(--glow-pink)}
.btn.know{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.btn.know:active:not(:disabled){border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent);box-shadow:var(--glow-green-strong)}
/* короткая вспышка после нажатия «Знаю / Не знаю» — видна и на телефоне */
.btn.know.flash{border-color:var(--good);color:var(--good);box-shadow:var(--glow-green-strong)}
.opt.ok,.match-btn.ok{box-shadow:var(--glow-green)}
.opt.no,.match-btn.no{box-shadow:var(--glow-red)}
.card input[type=text]:focus{box-shadow:var(--glow-pink)}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:40px;line-height:1.8}
.conf{position:fixed;top:-16px;width:8px;height:14px;z-index:2000;border-radius:2px;animation:confFall 2.6s ease-in forwards;pointer-events:none}
@keyframes confFall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide-in{animation:slideIn .3s cubic-bezier(.22,.61,.36,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:640px){
  .hero-top{padding:16px 18px;font-size:12px}
  .hero-main{padding:0 18px 20px}
  th,td{padding:10px 10px}
  td.num,th.num{display:none}
  td.w{font-size:19px;white-space:normal}
  td.rd{white-space:normal}
  .phr{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .card{padding:22px 14px}
  .dlg{grid-template-columns:1fr}
  .dlg .h:nth-child(2){display:none}
  .fc-card{height:360px}
  /* Таблица слов на телефоне — карточками, без горизонтальной прокрутки */
  #learn thead{display:none}
  #learn tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  #learn tbody tr:last-child{border-bottom:none}
  #learn td{border:0;padding:0}
  #learn td.w{grid-column:1;font-size:26px}
  #learn td.chk{grid-column:2;grid-row:1/4;width:auto}
  #learn td.rd{grid-column:1}
  #learn td.rd .pol{display:inline;margin-left:8px}
  #learn td.ty{grid-column:1;display:flex;gap:8px;align-items:center;margin:4px 0 6px}
  #learn td.ty .jp{margin-top:0!important}
  #learn td.tr{grid-column:1/-1}
  .hero-top{flex-direction:column;gap:2px}
  .bar{position:static}
  .daynav{display:grid;grid-template-columns:44px 1fr 1fr 44px;width:100%}
  .daylabel{min-width:0;grid-column:2/4}
  .daynav .pill{grid-column:1/3;text-align:center}
  .furi-toggle{grid-column:3/5}
  .tabs button{padding:8px 12px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-top">
      <div>Японский для начинающих · уровень <b>N5</b></div>
      <div>по учебнику <b>みんなの日本語</b></div>
    </div>
    <div class="hero-main">
      <div>
        <h1 class="hero-title"><ruby>日本語<rt>にほんご</rt></ruby></h1>
        <p class="hero-sub">Слова с фуриганой, частицы, формы глаголов и живая речь — урок за уроком.</p>
      </div>
      <div class="hero-card" id="heroCard"></div>
    </div>
  </header>

  <div class="bar" id="bar">
    <div class="daynav">
      <button class="iconbtn" id="prev" aria-label="Предыдущий день">‹</button>
      <span class="daylabel">День <b id="dayNum">1</b> · <span id="dayTopic"></span><span class="sublabel" id="daySub"></span></span>
      <button class="iconbtn" id="next" aria-label="Следующий день">›</button>
      <span class="pill" title="Дней подряд с занятиями">Серия: <b id="streakEl">0</b></span>
      <button class="furi-toggle" id="furiBtn" aria-pressed="true" title="Показать или скрыть чтение над кандзи">ふりがな</button>
    </div>
    <nav class="tabs" id="mainTabs" aria-label="Разделы">
      <button data-tab="learn">Слова</button>
      <button data-tab="grammar">Грамматика</button>
      <button data-tab="practice">Практика</button>
      <button data-tab="test">Тест</button>
      <button data-tab="review">Повторить<span class="badge" id="srsBadge"></span></button>
      <button data-tab="stats">Прогресс</button>
    </nav>
  </div>

  <div class="subtabs" id="subTabs">
    <button data-mode="flashcards">Карточки</button>
    <button data-mode="match">Пары</button>
    <button data-mode="gaps">Пропуски</button>
    <button data-mode="kanji">Кандзи</button>
    <button data-mode="particles">Частицы</button>
    <button data-mode="forms">Формы</button>
    <button data-mode="polite">Вежливо ↔ просто</button>
  </div>

  <div class="progress"><div id="progBar"></div></div>

  <section class="panel" id="learn"></section>
  <section class="panel" id="grammar"></section>
  <section class="panel" id="flashcards"></section>
  <section class="panel" id="match"></section>
  <section class="panel" id="gaps"></section>
  <section class="panel" id="kanji"></section>
  <section class="panel" id="particles"></section>
  <section class="panel" id="forms"></section>
  <section class="panel" id="polite"></section>
  <section class="panel" id="test"></section>
  <section class="panel" id="review"></section>
  <section class="panel" id="stats"></section>

  <footer id="footer"></footer>
</div>

<div class="word-popup" id="wordPopup" role="dialog" aria-live="polite"></div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
/*APP*/
</script>
</body>
</html>
